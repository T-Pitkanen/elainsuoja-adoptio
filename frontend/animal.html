<!doctype html>
<html lang="fi">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Eläin | Vaasan Eläinsuoja</title>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;700&display=swap"
		/>
		<link rel="stylesheet" href="styles/style.css" />
		<link rel="stylesheet" href="styles/animal.css" />
	</head>
	<body>
		<header>
			<h1>Vaasan Eläinsuoja</h1>
		</header>

		<main>
			<a class="back" href="index.html">← Takaisin eläimiin</a>
			<p id="message">Ladataan...</p>
			<article id="animal" class="animal-detail"></article>
		</main>

		<section id="adopt-section" class="adopt" hidden>
			<h2>Hae adoptiota</h2>
			<form id="adopt-form">
				<label
					>Nimi *
					<input type="text" name="applicant_name" required />
				</label>
				<label
					>Sähköposti *
					<input type="email" name="email" required />
				</label>
				<label
					>Puhelin
					<input type="tel" name="phone" />
				</label>
				<label
					>Kerro itsestäsi ja kodistasi
					<textarea name="message" rows="4"></textarea>
				</label>
				<p id="form-error" class="form-error" role="alert"></p>
				<button type="submit" class="button">Lähetä hakemus</button>
			</form>
		</section>

		<script src="scripts/animal.js"></script>
	</body>
</html>
